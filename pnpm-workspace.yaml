packages:
  - apps/*
  - packages/*
  - scripts

# Single place for versions shared by several workspaces (`"dep": "catalog:"`).
catalog:
  '@types/node': 22.20.5
  '@vitest/coverage-v8': 4.1.12
  eslint: 9.39.5
  postgres: 3.4.9
  prettier: 3.9.10
  tsx: 4.23.15
  turbo: 2.11.10
  typescript: 5.9.3
  vitest: 4.1.12
  zod: 4.6.7

# pnpm 10 blocks install scripts by default; allow only the ones that need them.
onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - sharp
  - unrs-resolver
